[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eks-upgrade-advisor"
version = "1.0.0"
description = "Generates EKS upgrade compatibility reports by auto-discovering cluster addons and ArgoCD-managed Helm charts"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "kubernetes>=29.0.0",
    "pyyaml==6.0.3",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
eks-upgrade-advisor = "eks_upgrade_advisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eks_upgrade_advisor.report" = ["*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/eks_upgrade_advisor/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
